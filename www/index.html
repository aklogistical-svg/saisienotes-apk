<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AdminSchool extension</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header id="HeadWrap">
  <h2 id="openGuide">✦ SAISIE DE NOTES</h2>

  <div class="header-spacer"></div>

  <button id="openBtn" class="hbtn" title="Charger un fichier" aria-label="Charger un fichier">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a1.5 1.5 0 0 1 1.5-1.5h4.379a1.5 1.5 0 0 1 1.06.44l1.122 1.12a1.5 1.5 0 0 0 1.06.44H19.5A1.5 1.5 0 0 1 21 9.5"/><path d="M3 7.5v9A1.5 1.5 0 0 0 4.5 18h13.44a1.5 1.5 0 0 0 1.45-1.11l1.88-6.9a1.2 1.2 0 0 0-1.16-1.5H6a1.5 1.5 0 0 0-1.45 1.11L3 15"/></svg></span>
    <span class="txt">Charger</span>
  </button>
  <button id="saveBtn" class="hbtn" title="Enregistrer" aria-label="Enregistrer">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a1.5 1.5 0 0 1-2-2V5a1.5 1.5 0 0 1 2-2h11l5 5v11a1.5 1.5 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg></span>
    <span class="txt">Enregistrer</span>
  </button>
  <button id="exportBtn" class="hbtn" title="Exporter" aria-label="Exporter">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H6a1.5 1.5 0 0 0-2 2v12a1.5 1.5 0 0 0 2 2h12a1.5 1.5 0 0 0 2-2v-4"/><path d="M10 16c0-5 4-8 9-8"/><path d="M15 4l4 4-4 4"/></svg></span>
    <span class="txt">Exporter</span>
  </button>
  <div class="infosource">
    <button id="netToggle" class="hbtn serve-btn" title="Connexion serveur" aria-label="Connexion serveur">
      <span id="netIndicator" class="serve-indic"></span>
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="6" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="6" rx="1.5"/><circle cx="7" cy="7.5" r=".75" fill="currentColor" stroke="none"/><circle cx="7" cy="16.5" r=".75" fill="currentColor" stroke="none"/></svg></span>
      <span class="txt">Connexion</span>
    </button>
    <button id="toggleView" class="hbtn" type="button" aria-label="Passer en vue cartes" title="Passer en vue cartes">
      <span class="ico"></span>
      <span class="txt">Cartes</span>
    </button>
    <button id="expDownload" class="hbtn" title="Télécharger dans Downloads" aria-label="Télécharger dans Downloads">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 11.5 12 16l4.5-4.5"/><path d="M4.5 16.5v2A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg></span>
      <span class="txt">Télécharger</span>
    </button>
    <span id="txtPeriode"></span>
  </div>
</header>

<!-- Toggle pill – anchored under header, slides with it -->
<button id="toggleHeaderBtn" class="toggleheader" aria-label="Masquer l'entête" title="Masquer l'entête">
  <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></span>
</button>

<main id="MainWrap">
  <div class="toolbar">
    <label>Classe <select id="fClasseSel"></select></label>
    <label>Matière <select id="fMatiereSel"></select></label>
    <label>Ndevoir
      <select id="nbNotesSel">
        <option selected>1</option><option>2</option><option>3</option>
      </select>
    </label>
    <span id="effectif" class="status"></span>
    <span id="msgstate">Charger le fichier</span>
  </div>

  <div class="table-wrap" id="tableWrap">
    <table>
      <thead id="theadtab"></thead>
      <tbody id="tbodytab"></tbody>
    </table>
  </div>

  <div class="cards-wrap" id="cardstab"></div>
</main>

<footer><span id="txtSource" class="status"></span></footer>
<input type="file" id="fileInput" accept=".json" style="display:none">
<div class="toast-wrap" id="toastWrap"></div>

<!-- ── PAVÉ NUMÉRIQUE MOBILE ─────────────────────────────── -->
<div id="numpadBackdrop"></div>
<div id="numpadSheet" role="dialog" aria-label="Saisie de note">
  <div class="np-handle-wrap">
    <div class="np-handle"></div>
    <button class="np-compact-toggle" id="npCompactToggle" title="Afficher/masquer les infos">⌃</button>
  </div>
  <div class="np-ctx">
    <button class="np-ctx-nav" id="npPrevEleve" title="Élève précédent">‹</button>
    <div class="np-ctx-info">
      <div class="np-ctx-name" id="npEleveName">—</div>
      <div class="np-ctx-pos"  id="npElevePos">0 / 0</div>
    </div>
    <button class="np-ctx-nav" id="npNextEleve" title="Élève suivant">›</button>
  </div>
  <div class="np-field-row">
    <span class="np-field-label" id="npFieldLabel" title="Changer de champ">Devoir 1</span>
    <span class="np-field-value" id="npFieldValue">—</span>
  </div>
  <div class="np-grid" id="npGrid">
    <button class="np-key" data-v="7">7</button>
    <button class="np-key" data-v="8">8</button>
    <button class="np-key" data-v="9">9</button>
    <button class="np-key" data-v="4">4</button>
    <button class="np-key" data-v="5">5</button>
    <button class="np-key" data-v="6">6</button>
    <button class="np-key" data-v="1">1</button>
    <button class="np-key" data-v="2">2</button>
    <button class="np-key" data-v="3">3</button>
    <button class="np-key np-key-comma" data-v="," id="npCommaKey">,</button>
    <button class="np-key" data-v="0">0</button>
    <button class="np-key np-key-del" id="npDelKey" data-v="DEL">⌫</button>
  </div>
  <div class="np-nav">
    <button class="np-nav-btn" id="npPrevField">← Préc</button>
    <button class="np-nav-btn" id="npNextField">Suiv →</button>
  </div>
</div>

<div id="confirmModal" hidden>
  <div class="confirm-box" role="dialog" aria-modal="true">
    <h3 id="confirmTitle"></h3>
    <p id="confirmMessage"></p>
    <div class="actions-conf">
      <button id="btnCancel">Annuler</button>
      <button id="btnOk">OK</button>
    </div>
  </div>
</div>

<div id="OverlayWrap" hidden>
  <div class="overlay-box">
    <span class="overlayText"></span>
    <div class="bar-progress"></div>
  </div>
</div>
<div id="permiOverlay" hidden>
  <button id="btnGrant">Autoriser l'accès au fichier</button>
</div>

<!-- ── GUIDE MULTI-ÉTAPES ─────────────────────────────────── -->
<div id="guideOverlay">
  <div id="guideMask"></div>
  <div id="guideSpot"></div>
  <div id="guideBubble" class="arrow-none">
    <div class="guide-header">
      <span class="guide-step-badge" id="guideStepLabel">Étape 1 / 7</span>
      <button class="guide-close-btn" id="guideCloseBtn" title="Fermer le guide">✕</button>
    </div>
    <div class="guide-title" id="guideTitle"></div>
    <div class="guide-desc"  id="guideDesc"></div>
    <div class="guide-progress-bar">
      <div class="guide-progress-fill" id="guideProgressFill"></div>
    </div>
    <div class="guide-nav">
      <button class="guide-btn guide-btn-prev" id="guidePrev">← Précédent</button>
      <div class="guide-step-dots" id="guideDots"></div>
      <button class="guide-btn guide-btn-next" id="guideNext">Suivant →</button>
    </div>
  </div>
</div>

<div id="loginPage" class="modalg">
  <div class="modal-content">
    <span class="closeg">&times;</span>
    <h3>Connexion au serveur</h3>
    <div class="cardlogin">
      <input id="userLogin" type="text" placeholder="Nom d'utilisateur">
      <input id="passLogin" type="password" placeholder="Mot de passe">
      <button id="loginBtn">
        <span class="btn-text">🔑 Se connecter</span>

      </button>
    </div>
  </div>
</div>

<!-- Capacitor : Filesystem + Haptics natifs (généré via esbuild, voir capacitor-entry.js) -->
<script src="capacitor-bundle.js"></script>
<!-- dexie -->
<script src="dexie.min.js"></script>
<!-- papaparse -->
<script src="papaparse.min.js"></script>
<!-- js custom -->
<script src="js/header-toggle.js"></script>
<script src="js/core.js"></script>
<script src="js/stores.js"></script>
<script src="js/file-io.js"></script>
<script src="js/ui-feedback.js"></script>
<script src="js/dataset.js"></script>
<script src="js/render.js"></script>
<script src="js/numpad.js"></script>
<script src="js/input-factory.js"></script>
<script src="js/wiring.js"></script>
<script src="js/guide.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
